<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy — Sandbox Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; font-family: "Press Start 2P", monospace;
         text-align: center; min-height: 100vh; padding: 12px; touch-action: manipulation;
         font-size: 11px; line-height: 1.7; }
  .back { display: inline-block; color: #fff; text-decoration: none; margin: 8px; font-size: 10px; }
  .back:hover { color: #ffff00; }
  h1 { font-size: 18px; margin: 8px 0; line-height: 1.6; }
  h1 .heart { color: #ff0000; }
  #msg { min-height: 1.6em; margin: 8px; color: #fff; }
  button { background: #000; color: #fff; border: 3px solid #fff; border-radius: 0;
           padding: 10px 16px; font-size: 11px; cursor: pointer; margin: 6px;
           font-family: "Press Start 2P", monospace; }
  button:hover:not(:disabled) { border-color: #ffff00; color: #ffff00; }
  button:active { background: #ffff00; color: #000; border-color: #ffff00; }
  button:disabled { opacity: .38; cursor: default; }
  button:focus-visible, .back:focus-visible { outline: 2px solid #ffff00; outline-offset: 2px; }
  .hint { color: #808080; font-size: 10px; margin-top: 6px; }
  #score { font-size: 16px; color: #ffff00; margin: 8px 0; }
  canvas { background: #000; border: 3px solid #fff; border-radius: 0; max-width: 94vw; cursor: pointer; }
/* arcade fullscreen fit */
:fullscreen h1,:fullscreen .back,:fullscreen .leaderboard,:fullscreen .hint{display:none!important}
:fullscreen canvas{max-width:100vw;max-height:none;width:min(94vw,61vh);width:min(94vw,61dvh);height:auto}
</style>
</head>
<body>
<a class="back" href="../index.html">← arcade</a>
<h1>🐤 Flappy <span class="heart">♥</span></h1>
<div id="score">0</div>
<canvas id="c" width="400" height="520"></canvas>
<div id="msg">* tap / click / space to flap</div>
<button id="start">Start</button>
<div class="hint">* don't touch the pipes</div>
<script src="../js/arcade.js"></script>
<script>
(function () {
  "use strict";
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const scoreEl = document.getElementById("score"), msgEl = document.getElementById("msg");
  const W = cv.width, H = cv.height;
  const BX = 80, BR = 16, GRAV = 0.45, FLAP = -7.5, GAP = 150, PW = 64, SPEED = 2.6;
  let by, bv, pipes, score, raf, running, dead;

  function reset() {
    by = H / 2; bv = 0; pipes = []; score = 0; dead = false; running = true;
    scoreEl.textContent = "0"; msgEl.textContent = "";
    cancelAnimationFrame(raf);
    loop();
  }
  function flap() {
    if (!running) return;
    if (dead) return;
    bv = FLAP;
  }
  function addPipe() {
    const margin = 60;
    const top = margin + Math.random() * (H - GAP - margin * 2);
    pipes.push({ x: W + 10, top: top, scored: false });
  }
  function die() {
    dead = true; running = false;
    cancelAnimationFrame(raf);
    msgEl.textContent = "* Game over! Score: " + score;
    Arcade.saveScore("flappy", Arcade.playerName(), score);
  }
  function loop() {
    if (!running) return;
    bv += GRAV; by += bv;
    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 220) addPipe();
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= SPEED;
      if (!p.scored && p.x + PW < BX - BR) { p.scored = true; score++; scoreEl.textContent = score; }
      if (p.x + PW < -20) pipes.splice(i, 1);
      // collision
      if (BX + BR > p.x && BX - BR < p.x + PW && (by - BR < p.top || by + BR > p.top + GAP)) return die();
    }
    if (by + BR > H || by - BR < 0) return die();

    // draw
    ctx.fillStyle = "#14142a"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2ecc71";
    pipes.forEach(function (p) {
      ctx.fillRect(p.x, 0, PW, p.top);
      ctx.fillRect(p.x, p.top + GAP, PW, H - p.top - GAP);
      ctx.fillStyle = "#27ae60";
      ctx.fillRect(p.x - 3, p.top - 18, PW + 6, 18);
      ctx.fillRect(p.x - 3, p.top + GAP, PW + 6, 18);
      ctx.fillStyle = "#2ecc71";
    });
    // bird
    ctx.fillStyle = "#ffe600";
    ctx.beginPath(); ctx.arc(BX, by, BR, 0, 7); ctx.fill();
    ctx.fillStyle = "#0a0a14";
    ctx.beginPath(); ctx.arc(BX + 6, by - 4, 4, 0, 7); ctx.fill(); // eye
    ctx.fillStyle = "#ff2d95";
    ctx.fillRect(BX + BR - 4, by - 2, 10, 5); // beak
    raf = requestAnimationFrame(loop);
  }
  cv.addEventListener("pointerdown", flap);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { flap(); e.preventDefault(); }
  });
  document.getElementById("start").addEventListener("click", reset);
  // attract
  ctx.fillStyle = "#14142a"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#8a8aa8"; ctx.font = "20px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("* press start", W / 2, H / 2);
})();
</script>
</body>
</html>
