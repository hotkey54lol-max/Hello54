<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says — Neon Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05051a radial-gradient(ellipse at top,#101040 0%,#05051a 70%);color:#dfe6ff;font-family:'Courier New',Courier,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
.back{align-self:flex-start;color:#0ff;text-decoration:none;border:1px solid #0ff;border-radius:6px;padding:6px 12px;margin-bottom:10px;box-shadow:0 0 8px #0ff3;font-size:.9rem}
.back:hover{background:#0ff;color:#001}
h1{color:#0ff;text-shadow:0 0 12px #0ff,0 0 40px #0ff8;margin:6px 0 12px;font-size:1.7rem;letter-spacing:2px;text-align:center}
.scorebar{display:flex;gap:22px;margin-bottom:14px;font-size:1.05rem;flex-wrap:wrap;justify-content:center}
.scorebar b{color:#ffe14d;text-shadow:0 0 8px #ffe14d}
button{font-family:inherit;background:transparent;color:#0ff;border:2px solid #0ff;border-radius:8px;padding:10px 22px;font-size:1rem;cursor:pointer;text-shadow:0 0 6px #0ff;box-shadow:0 0 10px #0ff4,inset 0 0 8px #0ff2;transition:all .15s;margin:4px}
button:hover:not(:disabled){background:#0ff;color:#001;text-shadow:none;box-shadow:0 0 22px #0ff}
button:disabled{opacity:.35;cursor:default}
.msg{min-height:1.6em;margin:10px;color:#ff7bff;text-shadow:0 0 8px #f0f;text-align:center}
#gameover{background:#0a0a24;border:2px solid #f0f;border-radius:12px;padding:20px 30px;text-align:center;box-shadow:0 0 24px #f0f6;margin-top:14px}
#gameover h2{color:#f0f;text-shadow:0 0 12px #f0f;margin-bottom:8px}
.hidden{display:none!important}
.leaderboard{margin-top:18px;width:min(420px,92vw);border:1px solid #334;border-radius:10px;padding:12px 16px;background:#080818}
.leaderboard h3{color:#ffe14d;font-size:1rem;margin-bottom:8px;text-shadow:0 0 8px #ffe14d88}
.leaderboard ol{margin-left:20px;font-size:.95rem}
.leaderboard li{margin:3px 0}
.hint{color:#889;font-size:.85rem;margin-top:10px;text-align:center;max-width:480px}
#pads{display:grid;grid-template-columns:repeat(2,110px);gap:14px;margin:8px 0}
.pad{width:110px;height:110px;border-radius:16px;cursor:pointer;border:2px solid #0006;transition:all .12s;opacity:.35}
.pad[data-i="0"]{background:#0f0}.pad[data-i="1"]{background:#f00}
.pad[data-i="2"]{background:#ff0}.pad[data-i="3"]{background:#00f}
.pad.lit{opacity:1;box-shadow:0 0 34px currentColor;transform:scale(1.06)}
.pad[data-i="0"]{color:#0f0}.pad[data-i="1"]{color:#f00}.pad[data-i="2"]{color:#ff0}.pad[data-i="3"]{color:#00f}
</style>
</head>
<body>
<a class="back" href="../index.html">← HUB</a>
<h1>🎛️ SIMON SAYS</h1>
<div class="scorebar"><span>Score: <b id="score">0</b></span><span>Round: <b id="round">0</b></span><span>Strikes: <b id="strikes">0</b>/3</span></div>
<div id="pads">
  <div class="pad" data-i="0"></div><div class="pad" data-i="1"></div>
  <div class="pad" data-i="2"></div><div class="pad" data-i="3"></div>
</div>
<div class="msg" id="msg">Press Start, then repeat the sequence.</div>
<button id="startBtn">▶ Start</button>
<div id="gameover" class="hidden">
  <h2>GAME OVER</h2>
  <p>Final score: <b id="finalScore" style="color:#ffe14d">0</b></p>
  <p style="margin-top:6px;color:#889">Saved to leaderboard as <span id="who"></span></p>
  <button id="againBtn" style="margin-top:12px">↻ Play Again</button>
</div>
<div class="leaderboard"><h3>🏆 TOP SCORES</h3><ol id="scores"><li>Loading…</li></ol></div>
<p class="hint">Strict mode OFF — a mistake replays the sequence. 3 strikes and you're out. +100 per round.</p>
<script src="../js/arcade.js"></script>
<script>
if(!window.Arcade){window.Arcade={SUPABASE_URL:'',SUPABASE_ANON:'',playerName:()=>'Player',saveScore(){},getScores:async()=>[]};}
const GAME_ID='simon';
const pads=[...document.querySelectorAll('.pad')];
const freqs=[329.63,261.63,392.0,440.0];
const $=id=>document.getElementById(id);
let seq=[],pIdx=0,score=0,mistakes=0,inputOn=false,playing=false,actx=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function beep(f,dur){dur=dur||0.28;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0.18,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur);}catch(e){}}
function upd(){$('score').textContent=score;$('round').textContent=seq.length;$('strikes').textContent=mistakes;}
function setMsg(t){$('msg').textContent=t;}
function light(i){pads[i].classList.add('lit');beep(freqs[i]);setTimeout(()=>pads[i].classList.remove('lit'),320);}
async function playSeq(){inputOn=false;setMsg('Watch…');await sleep(650);for(const s of seq){light(s);await sleep(480);}setMsg('Your turn!');inputOn=true;pIdx=0;}
function newRound(){seq.push(Math.floor(Math.random()*4));upd();playSeq();}
function start(){seq=[];score=0;mistakes=0;playing=true;inputOn=false;$('gameover').classList.add('hidden');$('startBtn').disabled=true;upd();setMsg('Get ready…');setTimeout(newRound,700);}
function gameOver(){playing=false;inputOn=false;$('finalScore').textContent=score;$('who').textContent=Arcade.playerName();$('gameover').classList.remove('hidden');$('startBtn').disabled=false;$('startBtn').textContent='▶ Start';setMsg('');try{Arcade.saveScore(GAME_ID,Arcade.playerName(),score);}catch(e){}loadScores();}
pads.forEach((p,i)=>p.addEventListener('click',()=>{if(!inputOn||!playing)return;light(i);if(i===seq[pIdx]){pIdx++;if(pIdx===seq.length){score+=100;upd();inputOn=false;setMsg('Nice! +100');setTimeout(newRound,900);}}else{mistakes++;upd();inputOn=false;if(mistakes>=3){setMsg('Strike 3 — game over!');setTimeout(gameOver,600);}else{setMsg('Wrong! Strike '+mistakes+'/3 — watch again…');setTimeout(playSeq,1200);}}}));
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
async function loadScores(){try{const s=await Arcade.getScores(GAME_ID);const ol=$('scores');ol.innerHTML='';s.slice(0,10).forEach(r=>{const li=document.createElement('li');li.textContent=(r.player_name||r.playerName||r.name||'???')+' — '+r.score;ol.appendChild(li);});if(!s.length)ol.innerHTML='<li>No scores yet. Be the first!</li>';}catch(e){$('scores').innerHTML='<li>Leaderboard unavailable</li>';}}
loadScores();
</script>
</body>
</html>
