<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number — Neon Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05051a radial-gradient(ellipse at top,#101040 0%,#05051a 70%);color:#dfe6ff;font-family:'Courier New',Courier,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
.back{align-self:flex-start;color:#0ff;text-decoration:none;border:1px solid #0ff;border-radius:6px;padding:6px 12px;margin-bottom:10px;box-shadow:0 0 8px #0ff3;font-size:.9rem}
.back:hover{background:#0ff;color:#001}
h1{color:#0ff;text-shadow:0 0 12px #0ff,0 0 40px #0ff8;margin:6px 0 12px;font-size:1.7rem;letter-spacing:2px;text-align:center}
.scorebar{display:flex;gap:22px;margin-bottom:14px;font-size:1.15rem;flex-wrap:wrap;justify-content:center}
.scorebar b{color:#ffe14d;text-shadow:0 0 8px #ffe14d}
button{font-family:inherit;background:transparent;color:#0ff;border:2px solid #0ff;border-radius:8px;padding:10px 22px;font-size:1rem;cursor:pointer;text-shadow:0 0 6px #0ff;box-shadow:0 0 10px #0ff4,inset 0 0 8px #0ff2;transition:all .15s;margin:4px}
button:hover:not(:disabled){background:#0ff;color:#001;text-shadow:none;box-shadow:0 0 22px #0ff}
button:disabled{opacity:.35;cursor:default}
.msg{min-height:1.6em;margin:10px;color:#ff7bff;text-shadow:0 0 8px #f0f;text-align:center;font-size:1.1rem}
.msg.hot{color:#f66}.msg.cold{color:#6cf}
#gameover{background:#0a0a24;border:2px solid #f0f;border-radius:12px;padding:20px 30px;text-align:center;box-shadow:0 0 24px #f0f6;margin-top:14px}
#gameover h2{color:#f0f;text-shadow:0 0 12px #f0f;margin-bottom:8px}
.hidden{display:none!important}
.leaderboard{margin-top:18px;width:min(420px,92vw);border:1px solid #334;border-radius:10px;padding:12px 16px;background:#080818}
.leaderboard h3{color:#ffe14d;font-size:1rem;margin-bottom:8px;text-shadow:0 0 8px #ffe14d88}
.leaderboard ol{margin-left:20px;font-size:.95rem}
.leaderboard li{margin:3px 0}
.hint{color:#889;font-size:.85rem;margin-top:10px;text-align:center;max-width:480px}
#play{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
input{font-family:inherit;font-size:1.3rem;background:#0a0a24;color:#ffe14d;border:2px solid #0ff;border-radius:8px;padding:8px 14px;width:130px;text-align:center;box-shadow:0 0 10px #0ff3}
input:focus{outline:none;box-shadow:0 0 18px #0ff8}
#history{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px;margin-top:8px}
.gchip{border:1px solid #448;border-radius:6px;padding:3px 9px;font-size:.85rem;background:#0a0a20;color:#99a}
</style>
</head>
<body>
<a class="back" href="../index.html">← HUB</a>
<h1>🔢 GUESS THE NUMBER</h1>
<div class="scorebar"><span>Guesses: <b id="guesses">0</b></span><span>Range: <b>1–100</b></span></div>
<div class="msg" id="msg">I'm thinking of a number between 1 and 100…</div>
<div id="play">
  <input id="inp" type="number" min="1" max="100" placeholder="?">
  <button id="goBtn">Guess</button>
</div>
<div id="history"></div>
<button id="startBtn">↻ New Number</button>
<div id="gameover" class="hidden">
  <h2>🎯 CORRECT!</h2>
  <p>The number was <b id="wasNum" style="color:#ffe14d">?</b> — found in <b id="nGuesses" style="color:#ffe14d">0</b> guesses</p>
  <p>Score: <b id="finalScore" style="color:#ffe14d">0</b> <span style="color:#889;font-size:.85rem">(1000 − guesses × 100)</span></p>
  <p style="margin-top:6px;color:#889">Saved to leaderboard as <span id="who"></span></p>
  <button id="againBtn" style="margin-top:12px">↻ Play Again</button>
</div>
<div class="leaderboard"><h3>🏆 TOP SCORES</h3><ol id="scores"><li>Loading…</li></ol></div>
<p class="hint">Fewer guesses = bigger score. Binary search it!</p>
<script src="../js/arcade.js"></script>
<script>
if(!window.Arcade){window.Arcade={SUPABASE_URL:'',SUPABASE_ANON:'',playerName:()=>'Player',saveScore(){},getScores:async()=>[]};}
const GAME_ID='guessnumber';
const $=id=>document.getElementById(id);
let secret=0,guesses=0,over=false;
function start(){secret=1+Math.floor(Math.random()*100);guesses=0;over=false;$('guesses').textContent='0';$('history').innerHTML='';$('inp').value='';$('inp').disabled=false;$('goBtn').disabled=false;$('gameover').classList.add('hidden');setMsg("I'm thinking of a number between 1 and 100…",'');$('inp').focus();}
function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'');}
function guess(){if(over)return;const n=parseInt($('inp').value,10);if(!(n>=1&&n<=100)){setMsg('Enter a number from 1 to 100!','');return;}guesses++;$('guesses').textContent=guesses;const c=document.createElement('span');c.className='gchip';c.textContent=n;$('history').appendChild(c);$('inp').value='';$('inp').focus();
  if(n===secret){over=true;const score=Math.max(0,1000-guesses*100);$('wasNum').textContent=secret;$('nGuesses').textContent=guesses;$('finalScore').textContent=score;$('who').textContent=Arcade.playerName();$('gameover').classList.remove('hidden');$('inp').disabled=true;$('goBtn').disabled=true;setMsg('🎉 Nailed it!','');try{Arcade.saveScore(GAME_ID,Arcade.playerName(),score);}catch(e){}loadScores();}
  else if(n<secret){setMsg('📈 Too LOW — go higher!','cold');}
  else{setMsg('📉 Too HIGH — go lower!','hot');}}
$('goBtn').addEventListener('click',guess);
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')guess();});
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
async function loadScores(){try{const s=await Arcade.getScores(GAME_ID);const ol=$('scores');ol.innerHTML='';s.slice(0,10).forEach(r=>{const li=document.createElement('li');li.textContent=(r.player_name||r.playerName||r.name||'???')+' — '+r.score;ol.appendChild(li);});if(!s.length)ol.innerHTML='<li>No scores yet. Be the first!</li>';}catch(e){$('scores').innerHTML='<li>Leaderboard unavailable</li>';}}
start();loadScores();
</script>
</body>
</html>
