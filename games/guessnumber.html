<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number — Sandbox Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:"Press Start 2P",monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;font-size:12px;line-height:1.7}
.back{align-self:flex-start;color:#fff;text-decoration:none;border:2px solid #fff;border-radius:0;padding:8px 12px;margin-bottom:10px;font-size:.7rem}
.back:hover{border-color:#ffff00;color:#ffff00}
h1{color:#fff;margin:6px 0 12px;font-size:1.2rem;letter-spacing:1px;text-align:center}
.scorebar{display:flex;gap:22px;margin-bottom:14px;font-size:.8rem;flex-wrap:wrap;justify-content:center}
.scorebar b{color:#ffff00}
.scorebar .heart{color:#ff0000}
button{font-family:inherit;background:#000;color:#fff;border:2px solid #fff;border-radius:0;padding:10px 18px;font-size:.8rem;cursor:pointer;margin:4px}
button:hover:not(:disabled){border-color:#ffff00;color:#ffff00}
button:active:not(:disabled){background:#ffff00;color:#000}
button:disabled{opacity:.35;cursor:default}
.msg{min-height:1.6em;margin:10px;color:#fff;text-align:center}
#gameover{background:#111;border:3px solid #fff;border-radius:0;padding:20px 30px;text-align:center;margin-top:14px}
#gameover h2{color:#fff;margin-bottom:8px}
.hidden{display:none!important}
.leaderboard{margin-top:18px;width:min(420px,92vw);border:3px solid #fff;border-radius:0;padding:12px 16px;background:#111}
.leaderboard h3{color:#ffff00;font-size:.85rem;margin-bottom:8px}
.leaderboard ol{margin-left:20px;font-size:.8rem}
.leaderboard li{margin:3px 0}
.hint{color:#808080;font-size:.7rem;margin-top:10px;text-align:center;max-width:480px}
.msg{font-size:.9rem}
.msg.hot{color:#ff0000}.msg.cold{color:#808080}
#play{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}
input{font-family:inherit;font-size:.9rem;background:#111;color:#ffff00;border:3px solid #fff;border-radius:0;padding:8px 14px;width:130px;text-align:center}
input:focus{outline:none;border-color:#ffff00}
#history{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px;margin-top:8px}
.gchip{border:2px solid #fff;border-radius:0;padding:3px 9px;font-size:.7rem;background:#111;color:#808080}
</style>
</head>
<body>
<a class="back" href="../index.html">← HUB</a>
<h1>🔢 GUESS THE NUMBER</h1>
<div class="scorebar"><span class="heart">♥</span><span>Guesses: <b id="guesses">0</b></span><span>Range: <b>1–100</b></span></div>
<div class="msg" id="msg">* I'm thinking of a number between 1 and 100…</div>
<div id="play">
  <input id="inp" type="number" min="1" max="100" placeholder="?">
  <button id="goBtn">Guess</button>
</div>
<div id="history"></div>
<button id="startBtn">↻ New Number</button>
<div id="gameover" class="hidden">
  <h2>🎯 CORRECT!</h2>
  <p>The number was <b id="wasNum" style="color:#ffff00">?</b> — found in <b id="nGuesses" style="color:#ffff00">0</b> guesses</p>
  <p>Score: <b id="finalScore" style="color:#ffff00">0</b> <span style="color:#808080;font-size:.85rem">(1000 − guesses × 100)</span></p>
  <p style="margin-top:6px;color:#808080">Saved to leaderboard as <span id="who"></span></p>
  <button id="againBtn" style="margin-top:12px">↻ Play Again</button>
</div>
<div class="leaderboard"><h3>* TOP SCORES</h3><ol id="scores"><li>Loading…</li></ol></div>
<p class="hint">* Fewer guesses = bigger score. Binary search it!</p>
<script src="../js/arcade.js"></script>
<script>
if(!window.Arcade){window.Arcade={SUPABASE_URL:'',SUPABASE_ANON:'',playerName:()=>'Player',saveScore(){},getScores:async()=>[]};}
const GAME_ID='guessnumber';
const $=id=>document.getElementById(id);
let secret=0,guesses=0,over=false;
function start(){secret=1+Math.floor(Math.random()*100);guesses=0;over=false;$('guesses').textContent='0';$('history').innerHTML='';$('inp').value='';$('inp').disabled=false;$('goBtn').disabled=false;$('gameover').classList.add('hidden');setMsg("I'm thinking of a number between 1 and 100…",'');$('inp').focus();}
function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg '+(cls||'');}
function guess(){if(over)return;const n=parseInt($('inp').value,10);if(!(n>=1&&n<=100)){setMsg('Enter a number from 1 to 100!','');return;}guesses++;$('guesses').textContent=guesses;const c=document.createElement('span');c.className='gchip';c.textContent=n;$('history').appendChild(c);$('inp').value='';$('inp').focus();
  if(n===secret){over=true;const score=Math.max(0,1000-guesses*100);$('wasNum').textContent=secret;$('nGuesses').textContent=guesses;$('finalScore').textContent=score;$('who').textContent=Arcade.playerName();$('gameover').classList.remove('hidden');$('inp').disabled=true;$('goBtn').disabled=true;setMsg('🎉 Nailed it!','');try{Arcade.saveScore(GAME_ID,Arcade.playerName(),score);}catch(e){}loadScores();}
  else if(n<secret){setMsg('📈 Too LOW — go higher!','cold');}
  else{setMsg('📉 Too HIGH — go lower!','hot');}}
$('goBtn').addEventListener('click',guess);
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')guess();});
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
async function loadScores(){try{const s=await Arcade.getScores(GAME_ID);const ol=$('scores');ol.innerHTML='';s.slice(0,10).forEach(r=>{const li=document.createElement('li');li.textContent=(r.player_name||r.playerName||r.name||'???')+' — '+r.score;ol.appendChild(li);});if(!s.length)ol.innerHTML='<li>No scores yet. Be the first!</li>';}catch(e){$('scores').innerHTML='<li>Leaderboard unavailable</li>';}}
start();loadScores();
</script>
</body>
</html>
