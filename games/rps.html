<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors — Sandbox Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:"Press Start 2P",monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;font-size:12px;line-height:1.7}
.back{align-self:flex-start;color:#fff;text-decoration:none;border:2px solid #fff;border-radius:0;padding:8px 12px;margin-bottom:10px;font-size:.7rem}
.back:hover{border-color:#ffff00;color:#ffff00}
h1{color:#fff;margin:6px 0 12px;font-size:1.2rem;letter-spacing:1px;text-align:center}
.scorebar{display:flex;gap:22px;margin-bottom:14px;font-size:.8rem;flex-wrap:wrap;justify-content:center}
.scorebar b{color:#ffff00}
.scorebar .heart{color:#ff0000}
button{font-family:inherit;background:#000;color:#fff;border:2px solid #fff;border-radius:0;padding:10px 18px;font-size:.8rem;cursor:pointer;margin:4px}
button:hover:not(:disabled){border-color:#ffff00;color:#ffff00}
button:active:not(:disabled){background:#ffff00;color:#000}
button:disabled{opacity:.35;cursor:default}
.msg{min-height:1.6em;margin:10px;color:#fff;text-align:center}
#gameover{background:#111;border:3px solid #fff;border-radius:0;padding:20px 30px;text-align:center;margin-top:14px}
#gameover h2{color:#fff;margin-bottom:8px}
.hidden{display:none!important}
.leaderboard{margin-top:18px;width:min(420px,92vw);border:3px solid #fff;border-radius:0;padding:12px 16px;background:#111}
.leaderboard h3{color:#ffff00;font-size:.85rem;margin-bottom:8px}
.leaderboard ol{margin-left:20px;font-size:.8rem}
.leaderboard li{margin:3px 0}
.hint{color:#808080;font-size:.7rem;margin-top:10px;text-align:center;max-width:480px}
.msg{font-size:.9rem}
#arena{display:flex;gap:26px;align-items:center;margin:12px 0}
.fighter{font-size:4rem;background:#111;border:3px solid #fff;border-radius:0;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.fighter.you{border-color:#fff}
.fighter.cpu{border-color:#ffff00}
.vs{font-size:1.2rem;color:#ffff00}
#choices{display:flex;gap:12px;margin:8px 0}
#choices button{font-size:2.2rem;padding:10px 18px}
#log{max-width:440px;margin-top:6px;font-size:.7rem;color:#808080;text-align:center;min-height:2.2em}
</style>
</head>
<body>
<a class="back" href="../index.html">← HUB</a>
<h1>✂️ ROCK PAPER SCISSORS</h1>
<div class="scorebar"><span class="heart">♥</span><span>Round <b id="round">0</b>/5</span><span>Wins <b id="w">0</b></span><span>Losses <b id="l">0</b></span><span>Ties <b id="t">0</b></span></div>
<div id="arena">
  <div><div class="fighter you" id="youPick">❔</div><div style="text-align:center;color:#fff;margin-top:4px">YOU</div></div>
  <div class="vs">VS</div>
  <div><div class="fighter cpu" id="cpuPick">❔</div><div style="text-align:center;color:#ffff00;margin-top:4px">CPU</div></div>
</div>
<div id="choices">
  <button data-c="rock" title="Rock">🪨</button>
  <button data-c="paper" title="Paper">📄</button>
  <button data-c="scissors" title="Scissors">✂️</button>
</div>
<div class="msg" id="msg">* Best of 5 — pick your weapon!</div>
<div id="log"></div>
<div id="gameover" class="hidden">
  <h2 id="endTitle">MATCH OVER</h2>
  <p><b id="finalWL" style="color:#ffff00"></b></p>
  <p>Score: <b id="finalScore" style="color:#ffff00">0</b> <span style="color:#808080;font-size:.85rem">(wins×100 + ties×10)</span></p>
  <p style="margin-top:6px;color:#808080">Saved to leaderboard as <span id="who"></span></p>
  <button id="againBtn" style="margin-top:12px">↻ Play Again</button>
</div>
<div class="leaderboard"><h3>* TOP SCORES</h3><ol id="scores"><li>Loading…</li></ol></div>
<p class="hint">* Win = 100 pts, tie = 10 pts. The CPU is gloriously random.</p>
<script src="../js/arcade.js"></script>
<script>
if(!window.Arcade){window.Arcade={SUPABASE_URL:'',SUPABASE_ANON:'',playerName:()=>'Player',saveScore(){},getScores:async()=>[]};}
const GAME_ID='rps';
const $=id=>document.getElementById(id);
const EMOJI={rock:'🪨',paper:'📄',scissors:'✂️'};
const BEATS={rock:'scissors',paper:'rock',scissors:'paper'};
let round=0,w=0,l=0,t=0,over=false;
function upd(){$('round').textContent=Math.min(round,5);$('w').textContent=w;$('l').textContent=l;$('t').textContent=t;}
function setBtns(on){document.querySelectorAll('#choices button').forEach(b=>b.disabled=!on);}
function play(choice){
  if(over||round>=5)return;
  const cpu=['rock','paper','scissors'][Math.floor(Math.random()*3)];
  $('youPick').textContent=EMOJI[choice];$('cpuPick').textContent=EMOJI[cpu];
  round++;let res;
  if(choice===cpu){t++;res='tie 🤝';}
  else if(BEATS[choice]===cpu){w++;res='you win! 🎉';}
  else{l++;res='CPU wins 😤';}
  $('msg').textContent='Round '+round+': '+res;
  $('log').textContent='You: '+choice+' — CPU: '+cpu;
  upd();
  if(round>=5)end();
}
function end(){over=true;setBtns(false);const score=w*100+t*10;
  $('endTitle').textContent=w>l?'🏆 YOU WIN THE MATCH!':(w<l?'🤖 CPU TAKES IT':'🤝 DEAD EVEN');
  $('finalWL').textContent=w+'W – '+l+'L – '+t+'T';$('finalScore').textContent=score;
  $('who').textContent=Arcade.playerName();$('gameover').classList.remove('hidden');
  try{Arcade.saveScore(GAME_ID,Arcade.playerName(),score);}catch(e){}loadScores();}
function start(){round=0;w=0;l=0;t=0;over=false;upd();setBtns(true);$('youPick').textContent='❔';$('cpuPick').textContent='❔';$('msg').textContent='Best of 5 — pick your weapon!';$('log').textContent='';$('gameover').classList.add('hidden');}
document.querySelectorAll('#choices button').forEach(b=>b.addEventListener('click',()=>play(b.dataset.c)));
$('againBtn').addEventListener('click',start);
async function loadScores(){try{const s=await Arcade.getScores(GAME_ID);const ol=$('scores');ol.innerHTML='';s.slice(0,10).forEach(r=>{const li=document.createElement('li');li.textContent=(r.player_name||r.playerName||r.name||'???')+' — '+r.score;ol.appendChild(li);});if(!s.length)ol.innerHTML='<li>No scores yet. Be the first!</li>';}catch(e){$('scores').innerHTML='<li>Leaderboard unavailable</li>';}}
start();loadScores();
</script>
</body>
</html>
