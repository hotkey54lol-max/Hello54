<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman — Sandbox Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:"Press Start 2P",monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;font-size:12px;line-height:1.7}
.back{align-self:flex-start;color:#fff;text-decoration:none;border:2px solid #fff;border-radius:0;padding:8px 12px;margin-bottom:10px;font-size:.7rem}
.back:hover{border-color:#ffff00;color:#ffff00}
h1{color:#fff;margin:6px 0 12px;font-size:1.2rem;letter-spacing:1px;text-align:center}
.scorebar{display:flex;gap:22px;margin-bottom:14px;font-size:.8rem;flex-wrap:wrap;justify-content:center}
.scorebar b{color:#ffff00}
.scorebar .heart{color:#ff0000}
button{font-family:inherit;background:#000;color:#fff;border:2px solid #fff;border-radius:0;padding:10px 18px;font-size:.8rem;cursor:pointer;margin:4px}
button:hover:not(:disabled){border-color:#ffff00;color:#ffff00}
button:active:not(:disabled){background:#ffff00;color:#000}
button:disabled{opacity:.35;cursor:default}
.msg{min-height:1.6em;margin:10px;color:#fff;text-align:center}
#gameover{background:#111;border:3px solid #fff;border-radius:0;padding:20px 30px;text-align:center;margin-top:14px}
#gameover h2{color:#fff;margin-bottom:8px}
.hidden{display:none!important}
.leaderboard{margin-top:18px;width:min(420px,92vw);border:3px solid #fff;border-radius:0;padding:12px 16px;background:#111}
.leaderboard h3{color:#ffff00;font-size:.85rem;margin-bottom:8px}
.leaderboard ol{margin-left:20px;font-size:.8rem}
.leaderboard li{margin:3px 0}
.hint{color:#808080;font-size:.7rem;margin-top:10px;text-align:center;max-width:480px}
#gameover.win{border-color:#ffff00}
#gameover.win h2{color:#ffff00}
#gallows{font-size:1rem;line-height:1.25;color:#fff;background:#111;border:3px solid #fff;border-radius:0;padding:14px 22px;margin:6px 0}
#word{font-size:1.4rem;letter-spacing:.5em;margin:12px 0;color:#ffff00;text-align:center;padding-left:.5em}
#kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:480px;margin:8px 0}
#kb button{padding:8px 0;width:42px;font-size:.8rem}
#kb button.right{border-color:#ffff00;color:#ffff00}
#kb button.wrongb{border-color:#ff0000;color:#ff0000}
</style>
</head>
<body>
<a class="back" href="../index.html">← HUB</a>
<h1>🪢 HANGMAN</h1>
<div class="scorebar"><span class="heart">♥</span><span>Lives: <b id="lives">6</b></span><span>Wrong: <b id="wrongct">0</b></span></div>
<pre id="gallows"></pre>
<div id="word"></div>
<div class="msg" id="msg">* Pick a letter!</div>
<div id="kb"></div>
<button id="startBtn">↻ New Word</button>
<div id="gameover" class="hidden">
  <h2 id="endTitle">YOU WIN!</h2>
  <p>The word was <b id="wasWord" style="color:#ffff00"></b></p>
  <p>Score: <b id="finalScore" style="color:#ffff00">0</b> <span style="color:#808080;font-size:.85rem">(600 − wrong×100 + length×10)</span></p>
  <p style="margin-top:6px;color:#808080">Saved to leaderboard as <span id="who"></span></p>
  <button id="againBtn" style="margin-top:12px">↻ Play Again</button>
</div>
<div class="leaderboard"><h3>* TOP SCORES</h3><ol id="scores"><li>Loading…</li></ol></div>
<p class="hint">* 6 lives. Every wrong guess builds the gallows.</p>
<script src="../js/arcade.js"></script>
<script>
if(!window.Arcade){window.Arcade={SUPABASE_URL:'',SUPABASE_ANON:'',playerName:()=>'Player',saveScore(){},getScores:async()=>[]};}
const GAME_ID='hangman';
const $=id=>document.getElementById(id);
const WORDS=['neon','arcade','pixel','galaxy','robot','laser','joystick','console','retro','cyber','plasma','rocket','alien','ninja','wizard','dragon','photon','vector','matrix','arcade','synth','chrome','turbo','ghost','vapor'];
const STAGES=[
"  +---+\n  |   |\n      |\n      |\n      |\n      |\n=========",
"  +---+\n  |   |\n  O   |\n      |\n      |\n      |\n=========",
"  +---+\n  |   |\n  O   |\n  |   |\n      |\n      |\n=========",
"  +---+\n  |   |\n  O   |\n /|   |\n      |\n      |\n=========",
"  +---+\n  |   |\n  O   |\n /|\\  |\n      |\n      |\n=========",
"  +---+\n  |   |\n  O   |\n /|\\  |\n /    |\n      |\n=========",
"  +---+\n  |   |\n  O   |\n /|\\  |\n / \\  |\n      |\n========="];
let word='',guessed=null,wrong=0,over=false;
const kb=$('kb');
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{const b=document.createElement('button');b.textContent=l;b.dataset.l=l.toLowerCase();b.addEventListener('click',()=>guess(b.dataset.l));kb.appendChild(b);});
function render(){$('gallows').textContent=STAGES[wrong];$('lives').textContent=6-wrong;$('wrongct').textContent=wrong;
  $('word').textContent=word.split('').map(c=>guessed.has(c)?c:'_').join(' ');
  [...kb.children].forEach(b=>{const l=b.dataset.l;b.disabled=over||guessed.has(l);b.classList.toggle('right',guessed.has(l)&&word.includes(l));b.classList.toggle('wrongb',guessed.has(l)&&!word.includes(l));});}
function guess(l){if(over||guessed.has(l))return;guessed.add(l);
  if(word.includes(l)){$('msg').textContent='Nice — "'+l.toUpperCase()+'" is in there!';}
  else{wrong++;$('msg').textContent='Nope — "'+l.toUpperCase()+'" is not in the word.';}
  render();
  if(word.split('').every(c=>guessed.has(c)))end(true);
  else if(wrong>=6)end(false);}
function end(win){over=true;render();const score=Math.max(0,600-wrong*100+word.length*10);
  $('endTitle').textContent=win?'🎉 YOU WIN!':'💀 GAME OVER';$('gameover').classList.toggle('win',win);
  $('wasWord').textContent=word.toUpperCase();$('finalScore').textContent=score;$('who').textContent=Arcade.playerName();
  $('gameover').classList.remove('hidden');$('msg').textContent=win?'Word solved!':'Out of lives…';
  try{Arcade.saveScore(GAME_ID,Arcade.playerName(),score);}catch(e){}loadScores();}
function start(){word=WORDS[Math.floor(Math.random()*WORDS.length)];guessed=new Set();wrong=0;over=false;$('gameover').classList.add('hidden');$('msg').textContent='Pick a letter!';render();}
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
async function loadScores(){try{const s=await Arcade.getScores(GAME_ID);const ol=$('scores');ol.innerHTML='';s.slice(0,10).forEach(r=>{const li=document.createElement('li');li.textContent=(r.player_name||r.playerName||r.name||'???')+' — '+r.score;ol.appendChild(li);});if(!s.length)ol.innerHTML='<li>No scores yet. Be the first!</li>';}catch(e){$('scores').innerHTML='<li>Leaderboard unavailable</li>';}}
start();loadScores();
</script>
</body>
</html>
