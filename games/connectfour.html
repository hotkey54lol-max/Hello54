<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — Neon Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05051a radial-gradient(ellipse at top,#101040 0%,#05051a 70%);color:#dfe6ff;font-family:'Courier New',Courier,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
.back{align-self:flex-start;color:#0ff;text-decoration:none;border:1px solid #0ff;border-radius:6px;padding:6px 12px;margin-bottom:10px;box-shadow:0 0 8px #0ff3;font-size:.9rem}
.back:hover{background:#0ff;color:#001}
h1{color:#0ff;text-shadow:0 0 12px #0ff,0 0 40px #0ff8;margin:6px 0 12px;font-size:1.7rem;letter-spacing:2px;text-align:center}
.scorebar{display:flex;gap:22px;margin-bottom:14px;font-size:1.05rem;flex-wrap:wrap;justify-content:center}
.scorebar b{color:#ffe14d;text-shadow:0 0 8px #ffe14d}
button{font-family:inherit;background:transparent;color:#0ff;border:2px solid #0ff;border-radius:8px;padding:10px 22px;font-size:1rem;cursor:pointer;text-shadow:0 0 6px #0ff;box-shadow:0 0 10px #0ff4,inset 0 0 8px #0ff2;transition:all .15s;margin:4px}
button:hover:not(:disabled){background:#0ff;color:#001;text-shadow:none;box-shadow:0 0 22px #0ff}
button:disabled{opacity:.35;cursor:default}
.msg{min-height:1.6em;margin:10px;color:#ff7bff;text-shadow:0 0 8px #f0f;text-align:center}
#gameover{background:#0a0a24;border:2px solid #f0f;border-radius:12px;padding:20px 30px;text-align:center;box-shadow:0 0 24px #f0f6;margin-top:14px}
#gameover h2{color:#f0f;text-shadow:0 0 12px #f0f;margin-bottom:8px}
#gameover.win{border-color:#0f0;box-shadow:0 0 24px #0f06}
#gameover.win h2{color:#0f0;text-shadow:0 0 12px #0f0}
.hidden{display:none!important}
.leaderboard{margin-top:18px;width:min(420px,92vw);border:1px solid #334;border-radius:10px;padding:12px 16px;background:#080818}
.leaderboard h3{color:#ffe14d;font-size:1rem;margin-bottom:8px;text-shadow:0 0 8px #ffe14d88}
.leaderboard ol{margin-left:20px;font-size:.95rem}
.leaderboard li{margin:3px 0}
.hint{color:#889;font-size:.85rem;margin-top:10px;text-align:center;max-width:480px}
#board{background:#0a1a3a;border:2px solid #0ff;border-radius:12px;padding:12px;box-shadow:0 0 22px #0ff4;display:grid;grid-template-columns:repeat(7,52px);gap:7px;margin:8px 0}
.cell{width:52px;height:52px;border-radius:50%;background:#05051a;border:1px solid #224;cursor:pointer;transition:all .1s}
.colh{width:52px;height:26px;display:flex;align-items:center;justify-content:center;color:#0ff;font-size:1.1rem;cursor:pointer;opacity:.6}
.colh:hover{opacity:1;text-shadow:0 0 8px #0ff}
.cell.R{background:radial-gradient(circle at 35% 35%,#ff8f8f,#f00);box-shadow:0 0 12px #f00}
.cell.Y{background:radial-gradient(circle at 35% 35%,#fff3a0,#ffdd00);box-shadow:0 0 12px #ffdd00}
.cell.win4{outline:3px solid #0f0;outline-offset:-3px}
#cheads{display:grid;grid-template-columns:repeat(7,52px);gap:7px;margin-bottom:2px}
.you{color:#f66}.cpu{color:#fd0}
</style>
</head>
<body>
<a class="back" href="../index.html">← HUB</a>
<h1>⭕ CONNECT FOUR</h1>
<div class="scorebar"><span>You <b class="you">🔴</b></span><span>CPU <b class="cpu">🟡</b></span></div>
<div class="msg" id="msg">Your move — click a column!</div>
<div id="cheads"></div>
<div id="board"></div>
<button id="startBtn">↻ New Game</button>
<div id="gameover" class="hidden">
  <h2 id="endTitle">YOU WIN!</h2>
  <p>Score: <b id="finalScore" style="color:#ffe14d">0</b> <span style="color:#889;font-size:.85rem">(win 1000 · draw 300)</span></p>
  <p style="margin-top:6px;color:#889">Saved to leaderboard as <span id="who"></span></p>
  <button id="againBtn" style="margin-top:12px">↻ Play Again</button>
</div>
<div class="leaderboard"><h3>🏆 TOP SCORES</h3><ol id="scores"><li>Loading…</li></ol></div>
<p class="hint">Connect 4 in a row before the CPU does. It blocks — mostly.</p>
<script src="../js/arcade.js"></script>
<script>
if(!window.Arcade){window.Arcade={SUPABASE_URL:'',SUPABASE_ANON:'',playerName:()=>'Player',saveScore(){},getScores:async()=>[]};}
const GAME_ID='connectfour';
const $=id=>document.getElementById(id);
const R=6,C=7;
let board,over,lock;
const boardEl=$('board'),heads=$('cheads');
for(let c=0;c<C;c++){const h=document.createElement('div');h.className='colh';h.textContent='▼';h.addEventListener('click',()=>playerMove(c));heads.appendChild(h);}
function newBoard(){return Array.from({length:R},()=>Array(C).fill(null));}
function dropRow(c){for(let r=R-1;r>=0;r--)if(!board[r][c])return r;return -1;}
function checkWin(b,who){for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(b[r][c]!==who)continue;
  if(c+3<C&&b[r][c+1]===who&&b[r][c+2]===who&&b[r][c+3]===who)return[[r,c],[r,c+1],[r,c+2],[r,c+3]];
  if(r+3<R&&b[r+1][c]===who&&b[r+2][c]===who&&b[r+3][c]===who)return[[r,c],[r+1,c],[r+2,c],[r+3,c]];
  if(r+3<R&&c+3<C&&b[r+1][c+1]===who&&b[r+2][c+2]===who&&b[r+3][c+3]===who)return[[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]];
  if(r-3>=0&&c+3<C&&b[r-1][c+1]===who&&b[r-2][c+2]===who&&b[r-3][c+3]===who)return[[r,c],[r-1,c+1],[r-2,c+2],[r-3,c+3]];}return null;}
function full(){return board[0].every(v=>v);}
function render(winCells){boardEl.innerHTML='';const set=winCells?new Set(winCells.map(p=>p[0]+','+p[1])):new Set();
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='cell'+(board[r][c]?' '+board[r][c]:'');if(set.has(r+','+c))d.classList.add('win4');d.addEventListener('click',()=>playerMove(c));boardEl.appendChild(d);}}
function aiPick(){const order=[3,2,4,1,5,0,6];
  for(const c of order){const r=dropRow(c);if(r<0)continue;board[r][c]='Y';const w=checkWin(board,'Y');board[r][c]=null;if(w)return c;}
  for(const c of order){const r=dropRow(c);if(r<0)continue;board[r][c]='R';const w=checkWin(board,'R');board[r][c]=null;if(w)return c;}
  const valid=order.filter(c=>dropRow(c)>=0);return valid[Math.floor(Math.random()*valid.length)];}
function playerMove(c){if(over||lock)return;const r=dropRow(c);if(r<0){$('msg').textContent='Column full — pick another!';return;}
  board[r][c]='R';let w=checkWin(board,'R');render(w);
  if(w)return end('win',1000,'🎉 YOU WIN! Four in a row!');
  if(full())return end('draw',300,'🤝 DRAW — board is full!');
  lock=true;$('msg').textContent='CPU is thinking…';
  setTimeout(()=>{const ac=aiPick();const ar=dropRow(ac);board[ar][ac]='Y';const aw=checkWin(board,'Y');render(aw);lock=false;
    if(aw)return end('lose',0,'🤖 CPU WINS — better luck next time!');
    if(full())return end('draw',300,'🤝 DRAW — board is full!');
    $('msg').textContent='Your move!';},450);}
function end(kind,score,title){over=true;$('endTitle').textContent=title;$('gameover').classList.toggle('win',kind==='win');
  $('finalScore').textContent=score;$('who').textContent=Arcade.playerName();$('gameover').classList.remove('hidden');
  $('msg').textContent='';try{Arcade.saveScore(GAME_ID,Arcade.playerName(),score);}catch(e){}loadScores();}
function start(){board=newBoard();over=false;lock=false;render(null);$('gameover').classList.add('hidden');$('msg').textContent='Your move — click a column!';}
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
async function loadScores(){try{const s=await Arcade.getScores(GAME_ID);const ol=$('scores');ol.innerHTML='';s.slice(0,10).forEach(r=>{const li=document.createElement('li');li.textContent=(r.player_name||r.playerName||r.name||'???')+' — '+r.score;ol.appendChild(li);});if(!s.length)ol.innerHTML='<li>No scores yet. Be the first!</li>';}catch(e){$('scores').innerHTML='<li>Leaderboard unavailable</li>';}}
start();loadScores();
</script>
</body>
</html>
